name: maillog_task
services:
  postgres:
    image: postgres:15
    container_name: maillog_postgres
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: maillog_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create.sql:/docker-entrypoint-initdb.d/create.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d maillog_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  perl-script:
    build: .
    container_name: maillog_parser
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./script.pl:/app/script.pl:ro
      - ./web.pl:/app/web.pl:ro
      - ./runner.sh:/app/runner.sh:ro
      - ./maillog:/app/maillog:ro
    working_dir: /app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: maillog_db
      DB_USER: username
      DB_PASSWORD: password
      WEB_PORT: 8080
    ports:
      - "8080:8080"
    restart: "no"



volumes:
  postgres_data: